<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>リザルト読み取りテスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="common.css?v=20261110b">
<style>
main{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.row label{display:grid;gap:4px;min-width:200px;flex:1}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--soft)}
.case{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:700px){.case{grid-template-columns:1fr}}
.case img.src{width:100%;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.vals{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:14px;align-items:center}
.vals dt{color:var(--muted)}
.vals dd{margin:0;font-family:var(--f-mono)}
.vals input{padding:2px 6px;font-size:13px;width:9em}
.ok{color:#1d7a43;font-weight:700}.ng{color:var(--danger);font-weight:700}.na{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--soft)}
.chip2.on{background:var(--accent);color:var(--accent-fg)}
details{font-size:13px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.steps figure{margin:0;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
.steps img{width:100%;image-rendering:pixelated}
.steps figcaption{font-family:var(--f-mono);font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--fg)}
.summary{font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>リザルト読み取りテスト</h1>
  <p class="note">リザルト画像から、参加者ページと同じ方法で値を読み取れるかを試すページです。画像はこのブラウザの中で読むだけで、どこにも送りません。でらっくす NET のスクリーンショット、ゲーム機のリザルト画面の写真、「大会リザルト」の写真に対応しています。</p>

  <section class="panel" style="display:grid;gap:12px">
    <div class="row">
      <label>部門（勝敗の決め方）
        <select id="metric">
          <option value="dx">らいむ部門（でらっくスコア・MAX・BREAK）</option>
          <option value="ach">れもん部門（達成率）</option>
        </select>
      </label>
      <label>探す曲名（大会リザルトのときに使います。複数は「,」で区切る）
        <input id="target" type="text" list="songs" placeholder="例 Energizing Flame, Sky Trails">
        <datalist id="songs"></datalist>
      </label>
      <label style="flex:0 0 auto;min-width:auto;display:flex;gap:6px;align-items:center;white-space:nowrap;color:var(--fg);padding-bottom:10px"><input id="debug" type="checkbox" style="width:auto">途中の画像も表示</label>
    </div>
    <div class="drop" id="drop" tabindex="0" role="button">ここに画像をドラッグするか、押して選んでください（複数選べます）</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <p class="summary" id="summary"></p>
  </section>

  <div id="cases" style="display:grid;gap:12px"></div>
</main>

<script src="config.js?v=20261111d"></script>
<script src="common.js?v=20261111d"></script>
<script src="ocr.js?v=20261111d"></script>
<script>
// 曲名の候補（入力の補助）
let NAMES = [];
loadCharts().then((c) => {
  const names = [...new Set(c.list.map((x) => x.name))].sort();
  NAMES = names;
  document.getElementById('songs').innerHTML = names.map((n) => `<option value="${esc(n)}">`).join('');
}).catch(() => {});

const $ = (id) => document.getElementById(id);
const queue = [];
let running = false;
$('drop').onclick = () => $('file').click();
$('drop').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('over'); add([...e.dataTransfer.files]); };
$('file').onchange = () => { add([...$('file').files]); $('file').value = ''; };

function add(files) {
  for (const f of files.filter((f) => f.type.startsWith('image/'))) {
    queue.push({ file: f, metric: $('metric').value, target: $('target').value.trim(), debug: $('debug').checked });
  }
  run();
}

// 参加者ページと同じく、元に近い大きさ（長い辺 2600px まで）で読む
async function toCanvas(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を読み込めませんでした')); i.src = url; });
    const k = Math.min(1, 2600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return { cv, url: URL.createObjectURL(file) };
  } finally { URL.revokeObjectURL(url); }
}

async function run() {
  if (running) return;
  running = true;
  const base = MoguOCR.getEngine();
  while (queue.length) {
    const job = queue.shift();
    const box = document.createElement('div'); box.className = 'case';
    $('cases').prepend(box);
    box.innerHTML = `<div><img class="src" alt=""><div class="note">${esc(job.file.name)}</div></div><div class="body"><p class="note">読み取り中…（初回は準備に時間がかかります）</p></div>`;
    const steps = [];
    MoguOCR.setEngine(async (cv, psm, chars, lang = 'eng') => {
      const text = await base(cv, psm, chars, lang);
      if (job.debug) steps.push({ img: cv.toDataURL('image/png'), label: `${lang} psm${psm}${chars ? ' [' + chars + ']' : ''}\n→ ${text.trim().slice(0, 120) || '（空）'}` });
      else steps.push(null);
      return text;
    });
    try {
      const { cv, url } = await toCanvas(job.file);
      box.querySelector('img.src').src = url;
      const t0 = performance.now();
      // 曲名に「,」を含む曲は、曲名の一覧にあればそのまま1曲として扱う
      const list = NAMES.includes(job.target) ? [job.target] : job.target.split(/[,、，]/).map((x) => x.trim()).filter(Boolean);
      if (list.length > 1) {
        const res = await MoguOCR.readMulti(cv, { metric: job.metric, targets: list, names: NAMES });
        const sec = ((performance.now() - t0) / 1000).toFixed(1);
        renderMulti(box.querySelector('.body'), job, res, sec, steps, cv);
      } else {
        const v = await MoguOCR.read(cv, { metric: job.metric, target: list[0] || '', names: NAMES });
        const sec = ((performance.now() - t0) / 1000).toFixed(1);
        render(box.querySelector('.body'), job, v, sec, steps, cv);
      }
    } catch (e) {
      box.querySelector('.body').innerHTML = `<p class="ng">エラー：${esc(e.message)}</p>`;
    }
  }
  MoguOCR.setEngine(base);
  running = false;
}

// 読み取り結果と、答え合わせ用の欄
function render(body, job, v, sec, steps, cv) {
  const kind = v.choices ? '大会リザルト' : v.brk != null && v.dxMax != null ? 'でらっくす NET（判定表あり）' : 'ゲーム機の写真 など';
  const rows = [
    ['達成率', v.ach != null ? v.ach + '%' : null, 'ach'],
    ['でらっくスコア', v.dx, 'dx'],
    ['MAX', v.dxMax, 'dxMax'],
    ['CP以外のBREAK', v.brk, 'brk'],
  ];
  const loss = v.dx != null && v.dxMax != null && v.brk != null ? v.dxMax - v.dx + 2 * v.brk : null;
  body.innerHTML = `
    <div class="chips"><span class="chip2">${esc(kind)}</span><span class="chip2">${job.metric === 'dx' ? 'らいむ' : 'れもん'}</span>${job.target ? `<span class="chip2">曲名：${esc(job.target)}</span>` : ''}<span class="chip2">${sec} 秒・読み取り ${steps.length} 回</span><span class="chip2">${cv.width}×${cv.height}</span></div>
    <dl class="vals" style="margin-top:8px">
      ${rows.map(([n, val, k]) => `<dt>${n}</dt><dd>${val == null ? '<span class="na">読めず</span>' : esc(String(val))}</dd><dd><input data-k="${k}" placeholder="正解（任意）" inputmode="decimal"> <span data-r="${k}"></span></dd>`).join('')}
      <dt>失点</dt><dd>${loss == null ? '<span class="na">—</span>' : '-' + loss}</dd><dd></dd>
    </dl>
    ${v.note ? `<p class="note">${esc(v.note)}</p>` : ''}
    ${v.choices ? `<p class="note" style="margin-bottom:4px">読み取った TRACK：</p><div class="chips">${v.choices.map((c) => `<span class="chip2${c.track === v.picked ? ' on' : ''}">TRACK ${c.track}：読んだ曲名「${esc(c.title || '読めず')}」→ 近い曲「${esc(c.guess || 'なし')}」（${(c.guessScore || 0).toFixed(2)}）　${c.ach}%${c.dx != null ? '・DX ' + c.dx : ''}${job.target ? `　探す曲との近さ ${c.sim.toFixed(2)}` : ''}</span>`).join('')}</div>${job.target ? '' : '<p class="note">探す曲名を入れると、その曲の TRACK を選びます。</p>'}` : ''}
    ${job.debug ? `<details><summary>途中の画像（${steps.length}）</summary><div class="steps">${steps.map((s) => `<figure><img src="${s.img}" alt=""><figcaption>${esc(s.label)}</figcaption></figure>`).join('')}</div></details>` : ''}`;
  // 正解を入れると、合っているかを表示
  body.querySelectorAll('input[data-k]').forEach((inp) => {
    inp.oninput = () => {
      const k = inp.dataset.k, got = v[k], want = inp.value.trim();
      const out = body.querySelector(`[data-r="${k}"]`);
      if (!want) { out.textContent = ''; out.className = ''; return; }
      const same = got != null && Number(String(got).replace(/[,%]/g, '')) === Number(want.replace(/[,%]/g, ''));
      out.textContent = same ? '一致' : '不一致'; out.className = same ? 'ok' : 'ng';
      tally();
    };
  });
}
// 複数の曲をまとめて読んだ結果
function renderMulti(body, job, res, sec, steps, cv) {
  body.innerHTML = `
    <div class="chips"><span class="chip2">${res.tournament ? '大会リザルト' : '1曲ぶんの画像'}</span><span class="chip2">${job.metric === 'dx' ? 'らいむ' : 'れもん'}</span><span class="chip2">${sec} 秒・読み取り ${steps.length} 回</span><span class="chip2">${cv.width}×${cv.height}</span></div>
    <table style="margin-top:8px;border-collapse:collapse;font-size:14px;width:100%">
      <tr><th style="text-align:left">探す曲</th><th>TRACK</th><th>達成率</th><th>でらっくスコア</th><th style="text-align:left">メモ</th></tr>
      ${res.results.map((r) => `<tr style="border-top:1px solid var(--line)"><td>${esc(r.target)}</td><td style="text-align:center">${r.picked ?? '—'}</td><td style="font-family:var(--f-mono)">${r.ach != null ? r.ach + '%' : '<span class="na">読めず</span>'}</td><td style="font-family:var(--f-mono)">${r.dx ?? '<span class="na">—</span>'}</td><td class="note">${esc(r.note || '')}</td></tr>`).join('')}
    </table>
    ${res.tracks ? `<p class="note" style="margin-bottom:4px">読み取った TRACK：</p><div class="chips">${res.tracks.map((c) => `<span class="chip2">TRACK ${c.track}：読んだ曲名「${esc(c.title || '読めず')}」→ 近い曲「${esc(c.guess || 'なし')}」（${(c.guessScore || 0).toFixed(2)}）　${c.ach}%${c.dx != null ? '・DX ' + c.dx : ''}</span>`).join('')}</div>` : ''}
    ${job.debug ? `<details><summary>途中の画像（${steps.length}）</summary><div class="steps">${steps.map((s) => `<figure><img src="${s.img}" alt=""><figcaption>${esc(s.label)}</figcaption></figure>`).join('')}</div></details>` : ''}`;
}
function tally() {
  const r = [...document.querySelectorAll('[data-r]')].filter((x) => x.textContent);
  const ok = r.filter((x) => x.className === 'ok').length;
  $('summary').textContent = r.length ? `答え合わせ：${r.length} 項目中 ${ok} 項目が一致` : '';
}
</script>
</body>
</html>
