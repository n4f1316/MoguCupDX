<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>もぐらたたきカップ 参加申請</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="common.css">
<style>
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
.hero{display:grid;gap:6px;padding-block:8px}
.hero .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{border-color:var(--ok)}
</style>
</head>
<body>
<main>
  <header class="hero">
    <span class="eyebrow">maimai 非公式大会</span>
    <h1 id="title">もぐらたたきカップ</h1>
    <p class="note">参加申請ページ</p>
  </header>

  <section class="panel" id="info" aria-label="大会情報">
    <dl class="facts">
      <dt>受付</dt><dd id="fOpen">読み込み中…</dd>
      <dt>締切</dt><dd id="fDeadline">-</dd>
      <dt>自選曲の定数</dt><dd id="fCap">-</dd>
      <dt>申請数</dt><dd id="fCount" class="num">-</dd>
    </dl>
    <p class="note" id="notice" hidden></p>
  </section>

  <form class="panel" id="form" novalidate>
    <h2>参加申請</h2>
    <label>エントリー名（大会で表示される名前、20文字まで）
      <input id="entryName" name="entryName" type="text" maxlength="20" required autocomplete="nickname">
    </label>
    <label>X（Twitter）の ID
      <input id="xId" name="xId" type="text" maxlength="16" required placeholder="@ なしで入力（例 Porto_mint）" autocapitalize="off" spellcheck="false">
    </label>
    <div class="row">
      <label>maimai のレート
        <input id="rating" name="rating" type="number" inputmode="numeric" min="0" max="20000" step="1" required placeholder="例 15800">
      </label>
      <label>2fRATE（☆7まで）
        <input id="frate" name="frate" type="number" inputmode="decimal" min="0" max="30" step="0.001" required placeholder="例 13.452">
      </label>
    </div>
    <div class="hp" aria-hidden="true"><label>website<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
    <p class="note">2fRATE は <a href="https://n4f1316.github.io/dxscore-tools/" target="_blank" rel="noopener">2fRATE のページ</a>のブックマークレットで確認できます。</p>
    <div class="btns"><button class="primary" id="submit" type="submit">申請する</button></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let open = false;

function fmtDeadline(s) {
  if (!s) return '期限なし';
  const [d, t] = s.split('T');
  const [y, m, dd] = d.split('-');
  return `${+y}年${+m}月${+dd}日 ${t || ''}（日本時間）`;
}

async function loadInfo() {
  try {
    const { settings: s, entryCount } = await api('api/public');
    $('#title').textContent = s.title;
    document.title = s.title + ' 参加申請';
    open = s.entryOpen;
    $('#fOpen').textContent = open ? '受付中' : '受付終了';
    $('#fDeadline').textContent = fmtDeadline(s.entryDeadline);
    $('#fCap').textContent = (s.constMin ? fmtConst(s.constMin) + ' 以上 ' : '') + fmtConst(s.constCap) + ' 以下';
    $('#fCount').textContent = entryCount + '人';
    if (s.notice) { $('#notice').hidden = false; $('#notice').textContent = s.notice; }
    if ($('#submit')) $('#submit').disabled = !open;
    if (!open && $('#submit')) setMsg('参加申請の受付は終了しています', 'err');
  } catch (e) {
    $('#fOpen').textContent = '読み込めませんでした';
    console.error(e);
    setMsg(e.message, 'err');
  }
}

function setMsg(t, cls = '') { const m = $('#msg'); if (!m) return; m.textContent = t; m.className = 'msg ' + cls; }

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = {
    entryName: $('#entryName').value.trim(),
    xId: $('#xId').value.trim().replace(/^@/, ''),
    rating: Number($('#rating').value),
    frate: Number($('#frate').value),
    website: $('#website').value,
  };
  if (!v.entryName) return setMsg('エントリー名を入力してください', 'err');
  if (!/^[A-Za-z0-9_]{1,15}$/.test(v.xId)) return setMsg('X の ID は英数字と _ の15文字以内で入力してください', 'err');
  if ($('#rating').value === '' || !Number.isInteger(v.rating)) return setMsg('maimai のレートを整数で入力してください', 'err');
  if ($('#frate').value === '' || !Number.isFinite(v.frate)) return setMsg('2fRATE を入力してください', 'err');
  $('#submit').disabled = true;
  setMsg('送信しています…');
  try {
    await api('api/entry', { method: 'POST', body: v });
    $('#form').classList.add('done');
    $('#form').innerHTML = `<h2>申請を受け付けました</h2>
      <p style="margin:0">エントリー名「${esc(v.entryName)}」（@${esc(v.xId)}）で申請しました。今後の案内をお待ちください。</p>`;
    loadInfo();
  } catch (err) {
    setMsg(err.message, 'err');
    $('#submit').disabled = !open;
  }
});

loadInfo();
</script>
</body>
</html>
