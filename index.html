<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>もぐらたたきカップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="common.css?v=20261014b">
<style>
main{max-width:720px;margin:0 auto;display:grid;gap:16px}
.hero{display:grid;gap:4px;padding-block:8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0}
.userbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px}
.seg{display:flex;gap:4px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.phase{display:inline-block;font-weight:700;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;text-align:center}
.vs .nm{font-family:var(--f-display);font-weight:800;font-size:1.2rem;overflow-wrap:anywhere}
.vs .v{font-family:var(--f-display);font-weight:800;color:var(--accent)}
/* 譜面の行（2fRATE の計算ページと同じ並び） */
.song{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.jk{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;background:var(--soft);box-shadow:0 0 0 1px var(--line)}
.sname{font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:4px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.k-DX{background:linear-gradient(90deg,#E0348C,#F29A2E)} .k-ST{background:#3B82C4}
.d-BASIC{background:#2E9E5B} .d-ADVANCED{background:#D98E04} .d-EXPERT{background:#E0434B} .d-MASTER{background:#8E44D6}
.d-REMASTER{background:#fff;color:#8E44D6;box-shadow:inset 0 0 0 1.5px #B68BE0}
.chip.c{background:var(--soft);color:var(--fg)} .chip.lv{background:transparent;color:var(--muted);padding-left:2px}
/* 選んだ3曲 */
.slots{display:grid;gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:62px;display:grid;align-items:center}
.slot.filled{border-style:solid;border-color:var(--accent)}
.slot .empty{color:var(--muted);font-size:13px}
.slotno{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* 楽曲一覧 */
.search{border-radius:999px;padding:8px 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border-radius:999px;padding:4px 12px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row.on{background:var(--soft)}
.row .go{font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap}
.row[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pager button{min-width:40px;padding:4px 10px;border-radius:999px}
.pager button.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* BAN・決定 */
.choices{display:grid;gap:8px}
.choice{all:unset;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice:focus-visible{outline:2px solid var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.choice.banned{opacity:.5;cursor:not-allowed;text-decoration:line-through}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ban{background:#E0434B;color:#fff} .tag.pick{background:var(--accent);color:var(--accent-fg)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{font-size:12px;color:var(--muted);line-height:1.8}
@media (max-width:520px){.row{grid-template-columns:40px minmax(0,1fr)}.row .go{display:none}.jk{width:40px;height:40px}.song{grid-template-columns:40px minmax(0,1fr) auto}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <span class="eyebrow">maimai 非公式大会</span>
    <h1 id="title">もぐらたたきカップ</h1>
  </header>

  <section class="panel" aria-label="お知らせ">
    <dl class="facts">
      <dt>参加申請</dt><dd id="fOpen">読み込み中…</dd>
      <dt>締切</dt><dd id="fDeadline">-</dd>
      <dt>いまの段階</dt><dd><span class="phase" id="fPhase">-</span> <span class="note" id="fPhaseNote"></span></dd>
    </dl>
    <p class="note" id="notice" hidden></p>
  </section>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <!-- ログイン・新規登録 -->
  <form class="panel" id="auth" hidden novalidate>
    <div class="seg" role="group" aria-label="ログインか新規登録か">
      <button type="button" data-mode="login" aria-pressed="true">ログイン</button>
      <button type="button" data-mode="register" aria-pressed="false">新規登録</button>
    </div>
    <p class="note" id="authNote">2fRATE のランキングに登録している人は、2fRATE のユーザー名と PIN でそのままログインできます。</p>
    <label>ユーザー名（英数字と _ で3〜16文字、公開されません）
      <input id="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16">
    </label>
    <label>PIN（数字4〜8桁）
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
    </label>
    <div class="btns"><button class="primary" id="authSubmit" type="submit">ログイン</button></div>
  </form>

  <div class="panel userbar" id="userbar" hidden>
    <span>ログイン中：<b id="uName"></b><span class="badge" id="uLinked" hidden>2fRATE 連携</span></span>
    <button type="button" class="ghost" id="logout">ログアウト</button>
  </div>

  <!-- 参加申請 -->
  <form class="panel" id="entryForm" hidden novalidate>
    <h2>参加申請</h2>
    <label>エントリー名（大会で表示される名前、20文字まで）
      <input id="entryName" type="text" maxlength="20" autocomplete="nickname">
    </label>
    <label>X（Twitter）の ID
      <input id="xId" type="text" maxlength="16" placeholder="@ なしで入力" autocapitalize="off" spellcheck="false">
    </label>
    <div class="row">
      <label>maimai のレート<input id="rating" type="number" inputmode="numeric" min="0" max="20000" step="1" placeholder="例 15800"></label>
      <label>2fRATE（☆7まで）<input id="frate" type="number" inputmode="decimal" min="0" max="30" step="0.001" placeholder="例 13.452"></label>
    </div>
    <div class="hp" aria-hidden="true"><label>website<input id="website" tabindex="-1" autocomplete="off"></label></div>
    <p class="note">2fRATE は <a href="https://n4f1316.github.io/dxscore-tools/" target="_blank" rel="noopener">2fRATE のページ</a>で確認できます。</p>
    <div class="btns"><button class="primary" type="submit">申請する</button></div>
  </form>

  <section class="panel" id="entryDone" hidden>
    <h2>参加申請済み</h2>
    <dl class="facts" id="entryFacts"></dl>
    <p class="note">内容を直したいときは運営に連絡してください。</p>
  </section>

  <!-- 自分の試合 -->
  <section class="panel" id="matchBox" hidden></section>

  <p class="foot">非公式のファンメイドツールです。株式会社セガおよび関連会社とは一切関係ありません。楽曲・ジャケット画像の著作権は、株式会社セガおよび各権利者に帰属します。</p>
</main>

<script src="config.js?v=20261014b"></script>
<script src="common.js?v=20261014b"></script>
<script src="player.js?v=20261014b"></script>
</body>
</html>
